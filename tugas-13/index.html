<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katalog Buah</title>
    <link rel="stylesheet" href="katalogbuah.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1><b>Katalog Menu Buah</b></h1>

    <div class="katalog">
      <div class="menu">
        <img src="jeruk.jpg" alt="Jeruk" />
        <h2 class="nama-buah">Jeruk</h2>
        <p class="harga">Rp 1.000 /kg</p>
      </div>

      <div class="menu">
        <img src="maga.jpg" alt="Mangga" />
        <h2 class="nama-buah">Mangga</h2>
        <p class="harga">Rp 2.000 /kg</p>
      </div>

      <div class="menu">
        <img src="kiwi.jpg" alt="Kiwi" />
        <h2 class="nama-buah">Kiwi</h2>
        <p class="harga">Rp 9.000 /kg</p>
      </div>
    </div>
  </body>
</html>
